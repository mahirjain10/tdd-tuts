name: Checkpoint 3
on:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run the linter
        run: echo "Linting" 
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Run the test
        run: echo "Testing" 
  deploy:
    needs: [lint,test]
    runs-on: ubuntu-latest
    steps:
      - name: Run the checkout
        uses: actions/checkout@v7
      - name: Run the setup
        uses: actions/setup-go@v7
        with:
          go-version: '1.25' 
      - name: "Deploy it" 
        run: echo "WAAOHH DEPLOYING..."