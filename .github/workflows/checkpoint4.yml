name: Checkpoint 4
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Python action
        uses: actions/setup-python@v7
        with:
          python-version: '3.13' 
      - name: Check verison
        run: python --version